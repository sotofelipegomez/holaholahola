<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Isita ❤️</title>
<style>
  :root {
    --bg1: #201609;
    --bg2: #5a3a10;
    --bg3: #7a4f14;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 38%, var(--bg3), var(--bg2) 55%, var(--bg1) 100%);
    background-size: 140% 140%;
    animation: bgShift 10s ease-in-out infinite;
    position: relative;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 50% 40%; }
    50% { background-position: 50% 60%; }
  }

  .scene {
    text-align: center;
    position: relative;
    z-index: 3;
  }

  /* ---------- Entrada con rebote (una sola vez) ---------- */
  .cat-entrance {
    animation: dropIn 1.1s cubic-bezier(.34,1.56,.64,1) both;
  }
  .bouquet-entrance {
    animation: dropIn 1.1s cubic-bezier(.34,1.56,.64,1) both 0.25s;
  }
  @keyframes dropIn {
    0%   { transform: translateY(-120px) scale(0.4); opacity: 0; }
    70%  { transform: translateY(6px) scale(1.05); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* ---------- Flotación continua ---------- */
  .cat-wrap {
    animation: float 3.2s ease-in-out infinite 1.1s;
    position: relative;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(0.6deg); }
  }

  .bouquet {
    transform-origin: 50% 85%;
    animation: wiggle 2.6s ease-in-out infinite 1.3s;
    margin-top: -95px;
    position: relative;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-2.5deg); }
    75% { transform: rotate(2.5deg); }
  }

  /* ---------- Partes animadas del gato ---------- */
  #tail {
    transform-origin: 265px 240px;
    animation: tailwag 2.2s ease-in-out infinite;
  }
  @keyframes tailwag {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-10deg); }
  }

  #earL { transform-origin: 130px 112px; animation: eartwitch 3.6s ease-in-out infinite; }
  #earR { transform-origin: 230px 112px; animation: eartwitch 3.6s ease-in-out infinite 0.4s; }
  @keyframes eartwitch {
    0%, 92%, 100% { transform: rotate(0deg); }
    95% { transform: rotate(-6deg); }
  }

  #eyelids { animation: blink 4.2s ease-in-out infinite; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(0.05); opacity: 0; }
    95% { transform: scaleY(1); opacity: 1; }
  }

  #pawR {
    transform-origin: 225px 280px;
    animation: pawwave 2.6s ease-in-out infinite;
  }
  @keyframes pawwave {
    0%, 100% { transform: rotate(18deg); }
    50% { transform: rotate(28deg); }
  }

  /* ---------- Flores: floración escalonada ---------- */
  .flower-bloom {
    opacity: 0;
    transform: scale(0);
    transform-box: fill-box;
    transform-origin: center;
    animation: bloom 0.7s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes bloom {
    0%   { opacity: 0; transform: scale(0) rotate(-15deg); }
    70%  { opacity: 1; transform: scale(1.15) rotate(4deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .sparkle {
    position: absolute;
    color: #fff6c4;
    font-size: 1rem;
    z-index: 4;
    animation: twinkle 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.1) rotate(90deg); }
  }

  /* ---------- Mensaje ---------- */
  .message {
    margin-top: 14px;
    font-size: 1.8rem;
    color: #ffe9b0;
    text-shadow: 0 0 12px rgba(255, 200, 80, 0.5);
    opacity: 0;
    animation: appear 1.5s ease forwards 1.6s;
    line-height: 1.4;
    padding: 0 20px;
  }
  @keyframes appear {
    to { opacity: 1; }
  }
  .heart {
    display: inline-block;
    animation: heartbeat 1.1s ease-in-out infinite;
    color: #ff3b3b;
    text-shadow: 0 0 10px rgba(255, 60, 60, 0.7);
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.25); }
    40% { transform: scale(0.95); }
    60% { transform: scale(1.15); }
  }

  .petal {
    position: absolute;
    top: -20px;
    font-size: 1.3rem;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    z-index: 1;
    user-select: none;
    pointer-events: none;
    opacity: 0.85;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="cat-entrance">
    <div class="cat-wrap">
      <svg width="360" height="330" viewBox="0 0 360 330" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="glow" cx="50%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffdf8a" stop-opacity="0.55"/>
            <stop offset="60%" stop-color="#ffb84d" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="eyeGrad" cx="45%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#fff6c4"/>
            <stop offset="55%" stop-color="#ffd93b"/>
            <stop offset="100%" stop-color="#e8a93b"/>
          </radialGradient>
          <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#333333"/>
            <stop offset="100%" stop-color="#0a0a0a"/>
          </linearGradient>
        </defs>

        <!-- Glow cálido de fondo -->
        <circle cx="180" cy="150" r="170" fill="url(#glow)"/>

        <!-- Sombra -->
        <ellipse cx="180" cy="315" rx="95" ry="12" fill="#000" opacity="0.25"/>

        <!-- Cola enroscada animada -->
        <path id="tail" d="M 265 240 Q 320 230 315 175 Q 312 150 290 158"
              stroke="url(#furGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>

        <!-- Cuerpo (chibi, redondo) -->
        <ellipse cx="180" cy="250" rx="80" ry="65" fill="url(#furGrad)"/>
        <ellipse cx="180" cy="258" rx="34" ry="26" fill="#1c1c1c" opacity="0.55"/>

        <!-- Patitas delanteras -->
        <ellipse id="pawR" cx="225" cy="280" rx="20" ry="26" fill="url(#furGrad)"/>
        <ellipse cx="135" cy="295" rx="20" ry="26" fill="url(#furGrad)" transform="rotate(-18 135 295)"/>

        <!-- Cabeza grande (chibi) -->
        <circle cx="180" cy="150" r="82" fill="url(#furGrad)"/>

        <!-- Orejas redondeadas y tiernas (animadas) -->
        <g id="earL"><path d="M 118 105 Q 100 45 145 75 Q 150 95 130 115 Z" fill="url(#furGrad)"/>
          <path d="M 128 98 Q 118 65 143 80 Q 145 92 133 103 Z" fill="#5a3d3d"/></g>
        <g id="earR"><path d="M 242 105 Q 260 45 215 75 Q 210 95 230 115 Z" fill="url(#furGrad)"/>
          <path d="M 232 98 Q 242 65 217 80 Q 215 92 227 103 Z" fill="#5a3d3d"/></g>

        <!-- Mejillas sonrosadas -->
        <ellipse cx="128" cy="170" rx="16" ry="10" fill="#ff9e9e" opacity="0.45"/>
        <ellipse cx="232" cy="170" rx="16" ry="10" fill="#ff9e9e" opacity="0.45"/>

        <!-- Ojos ENORMES y tiernos -->
        <ellipse cx="148" cy="152" rx="24" ry="28" fill="url(#eyeGrad)"/>
        <ellipse cx="212" cy="152" rx="24" ry="28" fill="url(#eyeGrad)"/>
        <ellipse cx="148" cy="158" rx="13" ry="16" fill="#1a1a1a"/>
        <ellipse cx="212" cy="158" rx="13" ry="16" fill="#1a1a1a"/>
        <circle cx="143" cy="148" r="5" fill="#fff"/>
        <circle cx="207" cy="148" r="5" fill="#fff"/>
        <circle cx="152" cy="162" r="2.5" fill="#fff" opacity="0.8"/>
        <circle cx="216" cy="162" r="2.5" fill="#fff" opacity="0.8"/>

        <!-- Párpados para parpadeo -->
        <g id="eyelids">
          <ellipse cx="148" cy="152" rx="25" ry="29" fill="url(#furGrad)"/>
          <ellipse cx="212" cy="152" rx="25" ry="29" fill="url(#furGrad)"/>
        </g>

        <!-- Pestañas -->
        <path d="M 126 138 Q 118 130 110 132" stroke="#111" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M 234 138 Q 242 130 250 132" stroke="#111" stroke-width="2.5" fill="none" stroke-linecap="round"/>

        <!-- Nariz y boquita -->
        <path d="M 172 180 L 188 180 L 180 190 Z" fill="#ffb6c9"/>
        <path d="M 180 190 Q 180 199 168 200" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 180 190 Q 180 199 192 200" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>

        <!-- Bigotes -->
        <line x1="115" y1="178" x2="75" y2="172" stroke="#999" stroke-width="1.5" opacity="0.7"/>
        <line x1="115" y1="188" x2="73" y2="190" stroke="#999" stroke-width="1.5" opacity="0.7"/>
        <line x1="245" y1="178" x2="285" y2="172" stroke="#999" stroke-width="1.5" opacity="0.7"/>
        <line x1="245" y1="188" x2="287" y2="190" stroke="#999" stroke-width="1.5" opacity="0.7"/>
      </svg>
    </div>
  </div>

  <!-- Ramo circular con floración animada -->
  <div class="bouquet-entrance">
    <div class="bouquet">
      <svg id="bouquetSvg" width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div class="message">Para mi Isita.<br>Vuelve rápido porque te extraño <span class="heart">❤️</span></div>
</div>

<div id="petals"></div>
<div id="sparkles"></div>

<script>
  // ---------- Generar ramo circular denso, estilo "sunburst" ----------
  const svgNS = "http://www.w3.org/2000/svg";
  const bouquetSvg = document.getElementById('bouquetSvg');
  const cx = 150, cy = 150;

  function el(tag, attrs) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // Papel envolvente oscuro en forma de abanico (picos detrás de las flores)
  const paperColors = ['#1c1a17', '#2b241c', '#3a2f22'];
  const paperPoints = 14;
  for (let i = 0; i < paperPoints; i++) {
    const angle = (i / paperPoints) * Math.PI * 2;
    const len = 133 + (i % 3) * 8;
    const spread = 0.16;
    const x1 = cx + Math.cos(angle - spread) * 61;
    const y1 = cy + Math.sin(angle - spread) * 61;
    const x2 = cx + Math.cos(angle + spread) * 61;
    const y2 = cy + Math.sin(angle + spread) * 61;
    const xTip = cx + Math.cos(angle) * len;
    const yTip = cy + Math.sin(angle) * len;
    const tri = el('polygon', {
      points: `${x1},${y1} ${xTip},${yTip} ${x2},${y2}`,
      fill: paperColors[i % paperColors.length]
    });
    bouquetSvg.appendChild(tri);
  }

  // Base clara detrás de las flores
  bouquetSvg.appendChild(el('circle', { cx, cy, r: 102, fill: '#fdf6e3' }));

  // Relleno de "baby's breath" (motitas blancas), también con floración escalonada
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 41 + Math.random() * 68;
    const px = cx + Math.cos(a) * r;
    const py = cy + Math.sin(a) * r;
    const dot = el('circle', { cx: px, cy: py, r: 2 + Math.random() * 2, fill: '#ffffff', opacity: 0.9, class: 'flower-bloom' });
    dot.style.animationDelay = (0.9 + Math.random() * 0.6) + 's';
    bouquetSvg.appendChild(dot);
  }

  // Flores (girasoles amarillos) en anillos concéntricos densos, con brillo interno
  const yellowTones = ['#ffb02e', '#ffc93c', '#ffd93b', '#ffe066', '#f5a623'];
  const centerTone = '#4a2f10';
  let flowerIndex = 0;

  function drawFlower(x, y, size, color, delay) {
    const g = el('g', { transform: `translate(${x},${y})`, class: 'flower-bloom' });
    g.style.animationDelay = delay + 's';
    const petals = 10;
    for (let p = 0; p < petals; p++) {
      const ang = (p / petals) * Math.PI * 2;
      const px = Math.cos(ang) * size * 0.55;
      const py = Math.sin(ang) * size * 0.55;
      g.appendChild(el('ellipse', {
        cx: px, cy: py, rx: size * 0.42, ry: size * 0.62,
        fill: color,
        transform: `rotate(${ang * 180 / Math.PI + 90} ${px} ${py})`
      }));
    }
    // brillo suave sobre los pétalos
    g.appendChild(el('circle', { cx: -size * 0.12, cy: -size * 0.12, r: size * 0.5, fill: '#ffffff', opacity: 0.12 }));
    g.appendChild(el('circle', { cx: 0, cy: 0, r: size * 0.42, fill: centerTone }));
    for (let d = 0; d < 6; d++) {
      const a2 = Math.random() * Math.PI * 2;
      const r2 = Math.random() * size * 0.3;
      g.appendChild(el('circle', { cx: Math.cos(a2) * r2, cy: Math.sin(a2) * r2, r: size * 0.03, fill: '#2b1c0c' }));
    }
    bouquetSvg.appendChild(g);
  }

  const rings = [
    { r: 0,   count: 1,  size: 31 },
    { r: 29,  count: 6,  size: 28 },
    { r: 56,  count: 9,  size: 27 },
    { r: 80,  count: 12, size: 24 },
    { r: 102, count: 14, size: 20 }
  ];

  rings.forEach((ring, ringIdx) => {
    for (let i = 0; i < ring.count; i++) {
      const angle = (i / ring.count) * Math.PI * 2 + ringIdx * 0.2;
      const jitterR = ring.r + (Math.random() * 6 - 3);
      const x = cx + Math.cos(angle) * jitterR;
      const y = cy + Math.sin(angle) * jitterR;
      const size = ring.size + (Math.random() * 6 - 3);
      const color = yellowTones[Math.floor(Math.random() * yellowTones.length)];
      const delay = ringIdx * 0.09 + i * 0.025;
      drawFlower(x, y, size, color, delay);
      flowerIndex++;
    }
  });

  // Corona chiquita arriba, como detalle final
  const crown = el('g', { transform: `translate(${cx},${cy - 119})`, class: 'flower-bloom' });
  crown.style.animationDelay = '1.1s';
  crown.appendChild(el('polygon', {
    points: '-16,10 -16,-6 -8,4 0,-10 8,4 16,-6 16,10',
    fill: '#e8b84b', stroke: '#a5791f', 'stroke-width': 1
  }));
  crown.appendChild(el('circle', { cx: 0, cy: -6, r: 3, fill: '#c0392b' }));
  bouquetSvg.appendChild(crown);

  // ---------- Pétalos cayendo de fondo ----------
  const petalContainer = document.getElementById('petals');
  const petalEmojis = ['🌻', '🌼', '✨'];
  for (let i = 0; i < 18; i++) {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
    petal.style.left = Math.random() * 100 + 'vw';
    const duration = 6 + Math.random() * 6;
    const delay = Math.random() * 8;
    petal.style.animationDuration = duration + 's';
    petal.style.animationDelay = delay + 's';
    petal.style.fontSize = (1 + Math.random()) + 'rem';
    petalContainer.appendChild(petal);
  }

  // ---------- Brillitos titilantes alrededor de la escena ----------
  const sparkleContainer = document.getElementById('sparkles');
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = '✦';
    s.style.left = (10 + Math.random() * 80) + 'vw';
    s.style.top = (10 + Math.random() * 80) + 'vh';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    sparkleContainer.appendChild(s);
  }
</script>

</body>
</html>
