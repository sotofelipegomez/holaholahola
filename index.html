<html lang="es">
<head>
<meta charset="UTF-8">

<title>Para mi Isita 💗</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;

        background:
            radial-gradient(circle at 50% 37%, #5b3a19 0%, #38240f 34%, #241609 100%);

        font-family: Georgia, "Times New Roman", serif;
        color: #ffe6ae;
    }

    /* ========================================
       PARTÍCULAS DEL FONDO
    ======================================== */

    .particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .particle {
        position: absolute;
        animation: float 10s ease-in-out infinite;
        opacity: .75;
        filter: drop-shadow(0 0 4px rgba(255,190,100,.2));
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0px) rotate(0deg);
        }

        50% {
            transform: translateY(-25px) rotate(12deg);
        }
    }

    /* ========================================
       CONTENEDOR CENTRAL
    ======================================== */

    .main {
        position: relative;
        z-index: 10;

        width: 100%;
        max-width: 700px;

        display: flex;
        flex-direction: column;
        align-items: center;

        text-align: center;

        animation: appear 1.5s ease;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(25px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* ========================================
       BRILLO DETRÁS DEL GATO
    ======================================== */

    .glow {
        position: absolute;

        width: 340px;
        height: 340px;

        top: 0;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(255,190,70,.24) 0%,
                rgba(255,170,40,.10) 47%,
                transparent 72%
            );

        filter: blur(2px);

        animation: glow 4s ease-in-out infinite;
        z-index: -1;
    }

    @keyframes glow {
        0%,100% {
            transform: scale(.95);
            opacity: .7;
        }

        50% {
            transform: scale(1.08);
            opacity: 1;
        }
    }

    /* ========================================
       ILUSTRACIÓN
    ======================================== */

    .illustration {
        width: min(430px, 90vw);
        height: auto;
        overflow: visible;

        filter:
            drop-shadow(0 18px 18px rgba(0,0,0,.35));

        animation: catFloat 4s ease-in-out infinite;
    }

    @keyframes catFloat {
        0%,100% {
            transform: translateY(0px);
        }

        50% {
            transform: translateY(-8px);
        }
    }

    /* ========================================
       TEXTO
    ======================================== */

    .text {
        margin-top: -10px;
        padding: 0 20px;
    }

    .text h1 {
        font-size: clamp(27px, 5vw, 41px);
        font-weight: 400;

        color: #ffe3a0;

        text-shadow:
            0 2px 8px rgba(0,0,0,.5),
            0 0 18px rgba(255,190,90,.16);

        margin-bottom: 9px;
    }

    .text p {
        font-size: clamp(20px, 3.4vw, 29px);
        color: #ffdb94;

        line-height: 1.35;
    }

    /* ========================================
       CORAZÓN BOTÓN
    ======================================== */

    .heart-button {
        border: none;
        background: transparent;

        font-size: 45px;

        cursor: pointer;

        margin-top: 20px;

        animation: heartbeat 1.4s infinite;

        filter: drop-shadow(0 0 8px rgba(255,110,150,.4));

        transition: .25s;
    }

    .heart-button:hover {
        transform: scale(1.25);
    }

    @keyframes heartbeat {

        0%,100% {
            transform: scale(1);
        }

        15% {
            transform: scale(1.18);
        }

        30% {
            transform: scale(1);
        }

        45% {
            transform: scale(1.12);
        }

        60% {
            transform: scale(1);
        }
    }

    /* ========================================
       MENSAJE SECRETO
    ======================================== */

    .secret {
        position: fixed;

        inset: 0;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 25px;

        background: rgba(20, 10, 3, .78);
        backdrop-filter: blur(7px);

        opacity: 0;
        visibility: hidden;

        transition: .5s;

        z-index: 100;
    }

    .secret.active {
        opacity: 1;
        visibility: visible;
    }

    .secret-card {
        position: relative;

        width: min(480px, 92vw);

        padding: 45px 30px;

        border-radius: 28px;

        background:
            linear-gradient(
                145deg,
                rgba(105,65,30,.97),
                rgba(65,37,16,.98)
            );

        border: 1px solid rgba(255,220,150,.2);

        box-shadow:
            0 25px 80px rgba(0,0,0,.5),
            inset 0 0 30px rgba(255,185,90,.04);

        text-align: center;

        transform: scale(.8);

        transition: .5s;
    }

    .secret.active .secret-card {
        transform: scale(1);
    }

    .secret-card h2 {
        color: #ffdca0;
        font-size: 31px;

        margin-bottom: 15px;
    }

    .secret-card p {
        color: #ffe6ba;
        font-size: 20px;
        line-height: 1.65;
    }

    .secret-card .big-heart {
        font-size: 60px;
        margin-bottom: 15px;

        animation: heartbeat 1.4s infinite;
    }

    .close {
        position: absolute;

        right: 18px;
        top: 14px;

        background: none;
        border: none;

        color: #ffd99b;

        font-size: 25px;

        cursor: pointer;
    }

    /* ========================================
       CORAZONES AL HACER CLICK
    ======================================== */

    .click-heart {
        position: fixed;

        pointer-events: none;

        font-size: 25px;

        z-index: 999;

        animation: flyHeart 1.8s ease-out forwards;
    }

    @keyframes flyHeart {

        from {
            opacity: 1;
            transform: translateY(0px) scale(.5) rotate(0deg);
        }

        to {
            opacity: 0;
            transform:
                translateY(-180px)
                scale(1.6)
                rotate(25deg);
        }
    }

    /* ========================================
       MÓVIL
    ======================================== */

    @media(max-width:600px) {

        .illustration {
            width: 360px;
        }

        .text {
            margin-top: -5px;
        }

        .glow {
            width: 280px;
            height: 280px;
        }
    }

</style>

<script>

/* ========================================
   ABRIR MENSAJE
======================================== */

function openSecret(event) {

    document
        .getElementById("secret")
        .classList
        .add("active");

    createHearts(event);
}


/* ========================================
   CERRAR MENSAJE
======================================== */

function closeSecret() {

    document
        .getElementById("secret")
        .classList
        .remove("active");
}


/* cerrar tocando fuera */

function closeOutside(event) {

    if(event.target.id === "secret") {
        closeSecret();
    }
}


/* ========================================
   EXPLOSIÓN DE CORAZONES
======================================== */

function createHearts(event) {

    const emojis = [
        "💗",
        "💕",
        "💖",
        "🌸",
        "✨",
        "🌻"
    ];

    for(let i = 0; i < 18; i++) {

        const heart =
            document.createElement("span");

        heart.className =
            "click-heart";

        heart.innerHTML =
            emojis[
                Math.floor(
                    Math.random() *
                    emojis.length
                )
            ];

        const startX =
            window.innerWidth / 2;

        const startY =
            window.innerHeight * .75;

        heart.style.left =
            startX +
            (Math.random() * 180 - 90)
            + "px";

        heart.style.top =
            startY +
            (Math.random() * 40 - 20)
            + "px";

        heart.style.animationDuration =
            (1.3 + Math.random())
            + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 2500);
    }
}


/* ========================================
   CORAZONES AL HACER CLICK EN LA PÁGINA
======================================== */

document.addEventListener(
    "click",
    function(event) {

        if(
            event.target.classList.contains("heart-button") ||
            event.target.classList.contains("close")
        ) return;

        if(
            document
            .getElementById("secret")
            .classList
            .contains("active")
        ) return;


        const heart =
            document.createElement("span");

        heart.className =
            "click-heart";

        heart.innerHTML =
            Math.random() > .5
            ? "💗"
            : "✨";

        heart.style.left =
            event.clientX + "px";

        heart.style.top =
            event.clientY + "px";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 2000);

    }
);

</script>
